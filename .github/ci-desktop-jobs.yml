# 这两个 job 属于 .github/workflows/ci.yml，但推送 workflow 文件需要 OAuth token 的
# `workflow` scope，本地凭证没有。放在这里可以随分支一起进仓库。
#
# 启用方式（二选一）：
#   1. gh auth refresh -s workflow  然后把下面内容粘进 ci.yml，正常提交推送；
#   2. 直接在 GitHub 网页上编辑 ci.yml 粘贴 —— 网页用的是登录会话，不受这个 scope 限制。
#
# 同时 ci.yml 的 `on:` 需要加一行 `workflow_dispatch:`，desktop job 才能手动触发。

# Rust 侧只跑单元测试与静态检查：持久化语义（外键顺序、只增不删、级联按库定位）
# 全靠这些测试守着。完整的 tauri build 放在下面手动触发的 job 里，不占每次 PR。
rust:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    # Tauri 在 Linux 上的系统依赖；仅为编译，不需要跑 GUI。
    - run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
          librsvg2-dev patchelf libglib2.0-dev
    - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
    - run: cargo test --manifest-path src-tauri/Cargo.toml

# 手动触发：不装本地 Rust 工具链也能拿到一个可运行的构建。
desktop:
  if: github.event_name == 'workflow_dispatch'
  runs-on: macos-14
  steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 11.17.0
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    - run: pnpm install --frozen-lockfile
    - run: pnpm tauri build --debug --bundles app
    - uses: actions/upload-artifact@v4
      with:
        name: Papertable-debug-app
        path: src-tauri/target/debug/bundle/macos/Papertable.app
