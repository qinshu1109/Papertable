name: Verify Papertable

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 这个 job 永远不能删。tauri-driver 需要 WebKitWebDriver，而它在 macOS 上不存在
  # ——没有办法对真实 Tauri 窗口跑 Playwright。web 构建是这个项目唯一可能的 e2e 覆盖。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Rust 侧只跑单元测试与静态检查：持久化语义（外键顺序、只增不删、级联按库定位）
  # 全靠这些测试守着。完整的 tauri build 放在下面手动触发的 job 里，不占每次 PR。
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri 在 Linux 上的系统依赖；仅为编译，不需要跑 GUI。
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # 手动触发：不装本地 Rust 工具链也能拿到一个可运行的构建。
  desktop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --bundles app
      - uses: actions/upload-artifact@v4
        with:
          name: Papertable-debug-app
          path: src-tauri/target/debug/bundle/macos/Papertable.app
